[project]
name = "regintel-mcp"
version = "0.1.0"
description = "MCP server that turns FDA regulations.gov dockets into structured regulatory intelligence (Black Swan Causal Labs)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["mcp>=1.2,<2", "httpx>=0.27", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema>=4"]

[project.scripts]
regintel-mcp = "regintel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regintel_mcp"]

name: MCP Registry maintenance
on:
  workflow_dispatch:
    inputs:
      retire_legacy:
        description: Retire the old GitHub-namespace listing after verifying the domain listing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v5
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download and verify publisher
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate server record
        run: ./mcp-publisher validate
      - name: Verify replacement is active
        if: inputs.retire_legacy
        run: |
          curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers/com.blackswancausallabs%2Fregintel-mcp/versions/0.1.0' | jq -e '._meta["io.modelcontextprotocol.registry/official"].status == "active"'
      - name: Authenticate for legacy namespace cleanup
        if: inputs.retire_legacy
        run: ./mcp-publisher login github-oidc
      - name: Retire legacy listing
        if: inputs.retire_legacy
        run: ./mcp-publisher status --status deleted --message "Moved to com.blackswancausallabs/regintel-mcp" io.github.Black-Swan-Causal-Labs/regintel-mcp 0.1.0
